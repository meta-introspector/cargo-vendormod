[package]
name = "cargo-vendormod"
version = "0.2.0"
edition = "2021"
description = "Vendor git dependencies as submodules with local mirrors, automatic rebasing, and cargo patch integration"
license = "MIT OR Apache-2.0"
authors = ["cargo-vendormod contributors"]

[[bin]]
name = "cargo-vendormod"
path = "src/main.rs"

[[bin]]
name = "vendoring"
path = "src/bin/vendoring.rs"

[[bin]]
name = "graph"
path = "src/bin/graph.rs"

[[bin]]
name = "processing"
path = "src/bin/processing.rs"

[[bin]]
name = "scanner"
path = "src/bin/scanner.rs"

[[bin]]
name = "scan-mirrors"
path = "src/bin/scan_mirrors.rs"

[[bin]]
name = "full-scan"
path = "src/bin/full_scan.rs"

[[bin]]
name = "extract-git-refs"
path = "src/bin/extract_git_refs.rs"

[[bin]]
name = "group_atlas"
path = "src/bin/group_atlas.rs"

[[bin]]
name = "simple_group_atlas"
path = "src/bin/simple_group_atlas.rs"

[[bin]]
name = "workload_processor"
path = "src/bin/workload_processor.rs"

[[bin]]
name = "workload_report"
path = "src/bin/workload_report.rs"

[[bin]]
name = "goal_tracker"
path = "src/bin/goal_tracker.rs"

[[bin]]
name = "dasl_metadata_processor"
path = "src/bin/dasl_metadata_processor.rs"

[[bin]]
name = "nur-flake"
path = "src/bin/nur_flake.rs"

[[bin]]
name = "process_dasl_index"
path = "src/bin/process_dasl_index.rs"

[[bin]]
name = "generate-flake"
path = "src/bin/generate-flake.rs"

[[bin]]
name = "nora-index"
path = "src/bin/nora-index.rs"

[lib]
name = "cargo_vendormod"
path = "src/lib.rs"

num-bigint = "0.4"

[dependencies]

git-config = "0.6.0"
project-detect = "0.1.2"
cid = "0.11"
multihash = "0.19"

# Core dependencies
clap = { version = "4.0", features = ["derive"] }
 serde = { version = "1.0", features = ["derive"] }
 serde_json = "1.0"
 serde_bytes = "0.11"
 serde_ipld_dagcbor = "0.6.4"
 tokio = { version = "1.0", features = ["full"] }
 anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
 
 # File system and path handling
 walkdir = "2.3"
 glob = "0.3"
 path-clean = "0.1"
 dirs = "5.0"
 pathdiff = "0.2"

# TOML handling
toml = "0.8"
toml_edit = "0.22"

# Git operations
git2 = { version = "0.18", features = ["vendored-openssl"] }

# HTTP client for pastbin integration
reqwest = { version = "0.11", features = ["json"], optional = true }

# Configuration and file watching
notify = "6.1"
config = { version = "0.13", features = ["ini"] }

# Process and command execution
duct = "0.13"

# Additional utilities
itertools = "0.12"
rayon = "1.8"
crossbeam = "0.8"
num_cpus = "1.16"
blake3 = "1.5"
camino = "1.1"
cargo_metadata = "0.18"
petgraph = "0.6"
lazy_static = "1.4"
regex = "1.10"
termion = "2.0"
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
hex = "0.4"
sha2 = "0.10"
postcard = { version = "1", features = ["alloc"] }
uds = "0.4"
ipld-car-ipc-shmem-linux = { path = "/home/mdupont/dasl/ipld-car-ipc-shmem-linux" }
memmap2 = "0.9"
  
  [dev-dependencies]
tempfile = "3"

[[test]]
name = "basic_tests"
path = "tests/basic_tests.rs"

[[test]]
name = "global_graph_tests"
path = "tests/global_graph_tests.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[test]]
name = "layer_processor_tests"
path = "tests/layer_processor_tests.rs"

[[test]]
name = "topological_tests"
path = "tests/topological_tests.rs"

[[test]]
name = "cli_tests"
path = "tests/cli_tests.rs"

[profile.release]
opt-level = 3
lto = true

[features]
default = []
pastbin = ["reqwest"]