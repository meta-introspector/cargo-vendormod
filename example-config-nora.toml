# NORA Configuration
[server]
host = "127.0.0.1"
port = 4000
public_url = "https://solana.solfunmeme.com/nora"

[storage]
mode = "local"
path = "/mnt/data1/nora/storage"

[cargo]
enabled = true
# Proxy to crates.io for packages not yet cached
proxy = "https://index.crates.io"
proxy_timeout = 30

[docker]
enabled = false

[npm]
enabled = false

[pypi]
enabled = false

[registries]
enable = ["cargo"]

[auth]
enabled = false
anonymous_read = true

[rate_limit]
enabled = false
