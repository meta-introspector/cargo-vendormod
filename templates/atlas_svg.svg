<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            .tile { stroke: #333; stroke-width: 2; }
            .tile-label { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
            .tile-order { font-family: Arial, sans-serif; font-size: 10px; fill: #666; text-anchor: middle; }
            .level-0 { fill: #ff6b6b; }
            .level-1 { fill: #4ecdc4; }
            .level-2 { fill: #45b7d1; }
            .level-3 { fill: #96ceb4; }
            .level-4 { fill: #ffeaa7; }
        </style>
    </defs>
    
    <!-- Title -->
    <text x="600" y="30" text-anchor="middle" font-size="24" font-weight="bold">Finite Simple Groups Atlas</text>
    
    <!-- Legend -->
    <g transform="translate(50, 60)">
        <text x="0" y="0" font-size="16" font-weight="bold">Group Families:</text>
        <rect x="0" y="10" width="20" height="20" class="level-0"/>
        <text x="25" y="25">Cyclic (11 groups)</text>
        
        <rect x="150" y="10" width="20" height="20" class="level-1"/>
        <text x="175" y="25">Alternating (7 groups)</text>
        
        <rect x="300" y="10" width="20" height="20" class="level-2"/>
        <text x="325" y="25">Lie Type (7 groups)</text>
        
        <rect x="450" y="10" width="20" height="20" class="level-3"/>
        <text x="475" y="25">Sporadic (1 group)</text>
    </g>
    
    <!-- Sample tiles -->
    <g transform="translate(50, 120)">
        <!-- Cyclic groups -->
        <g class="tile level-0">
            <rect x="0" y="0" width="80" height="60"/>
            <text x="40" y="20" class="tile-label">C₂</text>
            <text x="40" y="35" class="tile-order">|G| = 2</text>
        </g>
        
        <g class="tile level-0">
            <rect x="90" y="0" width="80" height="60"/>
            <text x="130" y="20" class="tile-label">C₃</text>
            <text x="130" y="35" class="tile-order">|G| = 3</text>
        </g>
        
        <g class="tile level-0">
            <rect x="180" y="0" width="80" height="60"/>
            <text x="220" y="20" class="tile-label">C₅</text>
            <text x="220" y="35" class="tile-order">|G| = 5</text>
        </g>
        
        <!-- Alternating groups -->
        <g class="tile level-1">
            <rect x="0" y="70" width="80" height="60"/>
            <text x="40" y="90" class="tile-label">A₅</text>
            <text x="40" y="105" class="tile-order">|G| = 60</text>
        </g>
        
        <g class="tile level-1">
            <rect x="90" y="70" width="80" height="60"/>
            <text x="130" y="90" class="tile-label">A₆</text>
            <text x="130" y="105" class="tile-order">|G| = 360</text>
        </g>
        
        <!-- Lie type groups -->
        <g class="tile level-2">
            <rect x="0" y="140" width="80" height="60"/>
            <text x="40" y="160" class="tile-label">PSL(2,7)</text>
            <text x="40" y="175" class="tile-order">|G| = 168</text>
        </g>
        
        <g class="tile level-2">
            <rect x="90" y="140" width="80" height="60"/>
            <text x="130" y="160" class="tile-label">PSL(2,8)</text>
            <text x="130" y="175" class="tile-order">|G| = 504</text>
        </g>
        
        <!-- Sporadic group -->
        <g class="tile level-3">
            <rect x="0" y="210" width="200" height="60"/>
            <text x="100" y="230" class="tile-label">Monster</text>
            <text x="100" y="245" class="tile-order">|G| = 8×10⁵³</text>
        </g>
    </g>
    
    <!-- Hierarchical view -->
    <g transform="translate(400, 120)">
        <text x="0" y="-10" font-size="16" font-weight="bold">Hierarchical View by Complexity:</text>
        
        <!-- Level 0 -->
        <text x="0" y="20" font-size="14">Level 0 (Simple):</text>
        <g transform="translate(0, 30)">
            <rect x="0" y="0" width="60" height="40" class="level-0"/>
            <text x="30" y="25" class="tile-label">C₂</text>
        </g>
        
        <!-- Level 1 -->
        <text x="0" y="90" font-size="14">Level 1 (Cyclic):</text>
        <g transform="translate(0, 100)">
            <rect x="0" y="0" width="60" height="40" class="level-0"/>
            <text x="30" y="25" class="tile-label">C₃</text>
            <rect x="70" y="0" width="60" height="40" class="level-0"/>
            <text x="100" y="25" class="tile-label">C₅</text>
        </g>
        
        <!-- Level 2 -->
        <text x="0" y="160" font-size="14">Level 2 (Alternating):</text>
        <g transform="translate(0, 170)">
            <rect x="0" y="0" width="60" height="40" class="level-1"/>
            <text x="30" y="25" class="tile-label">A₅</text>
            <rect x="70" y="0" width="60" height="40" class="level-1"/>
            <text x="100" y="25" class="tile-label">A₆</text>
        </g>
        
        <!-- Level 3 -->
        <text x="0" y="230" font-size="14">Level 3 (Lie Type):</text>
        <g transform="translate(0, 240)">
            <rect x="0" y="0" width="60" height="40" class="level-2"/>
            <text x="30" y="25" class="tile-label">PSL(2,7)</text>
            <rect x="70" y="0" width="60" height="40" class="level-2"/>
            <text x="100" y="25" class="tile-label">PSL(2,8)</text>
        </g>
        
        <!-- Level 4 -->
        <text x="0" y="300" font-size="14">Level 4 (Sporadic):</text>
        <g transform="translate(0, 310)">
            <rect x="0" y="0" width="120" height="40" class="level-3"/>
            <text x="60" y="25" class="tile-label">Monster</text>
        </g>
    </g>
    
    <!-- Composition example -->
    <g transform="translate(700, 120)">
        <text x="0" y="-10" font-size="16" font-weight="bold">Group Compositions:</text>
        
        <!-- Direct product example -->
        <g transform="translate(0, 20)">
            <text x="0" y="0" font-size="14">Direct Product: C₂ × C₃ ≅ C₆</text>
            
            <!-- Individual groups -->
            <rect x="0" y="10" width="60" height="40" class="level-0"/>
            <text x="30" y="35" class="tile-label">C₂</text>
            
            <text x="70" y="35" font-size="16">×</text>
            
            <rect x="90" y="10" width="60" height="40" class="level-0"/>
            <text x="120" y="35" class="tile-label">C₃</text>
            
            <text x="160" y="35" font-size="16">=</text>
            
            <rect x="180" y="10" width="60" height="40" class="level-0"/>
            <text x="210" y="35" class="tile-label">C₆</text>
        </g>
        
        <!-- Another composition -->
        <g transform="translate(0, 80)">
            <text x="0" y="0" font-size="14">Direct Product: A₅ × C₂</text>
            
            <!-- Individual groups -->
            <rect x="0" y="10" width="60" height="40" class="level-1"/>
            <text x="30" y="35" class="tile-label">A₅</text>
            
            <text x="70" y="35" font-size="16">×</text>
            
            <rect x="90" y="10" width="60" height="40" class="level-0"/>
            <text x="120" y="35" class="tile-label">C₂</text>
            
            <text x="160" y="35" font-size="16">=</text>
            
            <rect x="180" y="10" width="80" height="40" class="level-4"/>
            <text x="220" y="35" class="tile-label">S₅</text>
        </g>
    </g>
    
    <!-- Mathematical explanation -->
    <g transform="translate(50, 500)">
        <text x="0" y="0" font-size="16" font-weight="bold">Mathematical Background:</text>
        <text x="0" y="25" font-size="12">Finite simple groups are the "atoms" of group theory - they cannot be decomposed into smaller normal subgroups.</text>
        <text x="0" y="45" font-size="12">The classification theorem states that every finite simple group belongs to one of these categories:</text>
        <text x="0" y="65" font-size="12">1. Cyclic groups of prime order</text>
        <text x="0" y="85" font-size="12">2. Alternating groups Aₙ for n ≥ 5</text>
        <text x="0" y="105" font-size="12">3. Groups of Lie type (classical and exceptional)</text>
        <text x="0" y="125" font-size="12">4. Sporadic groups (26 exceptional cases)</text>
        <text x="0" y="145" font-size="12">5. Twisted Lie type groups</text>
    </g>
    
    <!-- Footer -->
    <text x="600" y="780" text-anchor="middle" font-size="12" fill="#666">
        Generated by cargo-vendormod group atlas generator
    </text>
</svg>